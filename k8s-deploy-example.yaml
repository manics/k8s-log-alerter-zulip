apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-log-alerter-zulip
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-log-alerter-zulip
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-log-alerter-zulip
subjects:
- kind: ServiceAccount
  name: k8s-log-alerter-zulip
roleRef:
  kind: Role
  name: k8s-log-alerter-zulip
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-log-alerter-config
data:
  config.json: |
    {
      "zulip": {
        "site": "https://zulip.example.com",
        "bot_email": "bot@example.com",
        "bot_key": "secret",
        "channel": "alerts"
      },
      "rules": {
        "Cryptnono killed": {
          "pod_labels": {
            "app.kubernetes.io/name": "cryptnono"
          },
          "regex": "\"action\":\\s*\"killed\""
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-log-alerter-zulip
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-log-alerter-zulip
  template:
    metadata:
      labels:
        app: k8s-log-alerter-zulip
    spec:
      serviceAccountName: k8s-log-alerter-zulip
      containers:
      - name: watcher
        image: ghcr.io/manics/k8s-log-alerter-zulip:latest
        args: ["-c", "/config/config.json"]
        ports:
        - containerPort: 8081
          name: health
        volumeMounts:
        - name: config-volume
          mountPath: /config
          readOnly: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 2
          periodSeconds: 5
      volumes:
      - name: config-volume
        configMap:
          name: k8s-log-alerter-config
