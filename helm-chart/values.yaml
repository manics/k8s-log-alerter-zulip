# Default values for k8s-log-alerter-zulip

image:
  repository: ghcr.io/manics/k8s-log-alerter-zulip
  pullPolicy: IfNotPresent
  # Default: Chart.AppVersion
  tag: ""

imagePullSecrets: []

# Override the chart name
nameOverride: ""
fullnameOverride: ""

zulip:
  site: https://zulip.example.com
  bot_email: bot@zulip.example.com
  bot_key: secret-api-key
  channel: alerts

rules: {}
  # "Rule Name 1":
  #   pod_labels:
  #     app.kubernetes.io/name: pod-name
  #   regex: regular-expression
  # "Cryptnono killed":
  #   pod_labels:
  #     app.kubernetes.io/name: cryptnono
  #   regex: "\"action\":\\s*\"killed\""
  #   # Group by pod name and match, limit to 1/minute but allow initial burst of 4, reset after 10 minutes
  #   json_grouping_fields:
  #     - "labels.io\\.kubernetes\\.pod\\.name"
  #     - "matched"
  #   limit_first_n: 4
  #   limit_interval_seconds: 60
  #   limit_reset_seconds: 600

# The service account and role
serviceAccount:
  create: true
  # Automatically mount ServiceAccount's API credentials
  automount: true
  annotations: {}
  # Default: fullname template.
  name: ""

podAnnotations: {}

podLabels: {}

podSecurityContext: {}

securityContext: {}

healthcheck:
  port: 8081

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Additional volumes
volumes: []

# Additional volumeMounts
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
