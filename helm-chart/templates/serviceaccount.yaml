{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "k8s-log-alerter-zulip.serviceAccountName" . }}
  labels:
    {{- include "k8s-log-alerter-zulip.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}


---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "k8s-log-alerter-zulip.serviceAccountName" . }}
  labels:
    {{- include "k8s-log-alerter-zulip.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "k8s-log-alerter-zulip.serviceAccountName" . }}
  labels:
    {{- include "k8s-log-alerter-zulip.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "k8s-log-alerter-zulip.serviceAccountName" . }}
roleRef:
  kind: Role
  name: {{ include "k8s-log-alerter-zulip.serviceAccountName" . }}
  apiGroup: rbac.authorization.k8s.io

{{- end }}
